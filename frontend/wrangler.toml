name = "questmark-app"
compatibility_date = "2026-07-09"
compatibility_flags = ["nodejs_compat"]
main = "./build/_worker.js"

# Real Worker deploy (adapter-cloudflare): marketing/SEO routes are prerendered
# to static HTML and served straight from `assets`; everything else (the
# authenticated app, /auth/callback, /lists/join/[token]) is routed through
# the Worker itself, which matches the real SvelteKit route tree - so unknown
# paths get a genuine 404 instead of always falling back to index.html.
[assets]
directory = "./build"
binding = "ASSETS"
not_found_handling = "404-page"
